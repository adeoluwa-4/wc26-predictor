name: Update WC26 model after matchday

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - backfill
      backfill_start:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        type: string
      backfill_end:
        description: "Backfill end date (YYYY-MM-DD)"
        required: false
        type: string

concurrency:
  group: wc26-model-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download immutable source candidate
        run: curl -L "$RESULTS_URL" -o /tmp/international_results.zip
        env:
          RESULTS_URL: https://github.com/martj42/international_results/archive/refs/heads/master.zip

      - name: Extract raw source bundle
        run: python -m src.data.refresh_international_results --zip-path /tmp/international_results.zip

      - name: Run incremental refresh, analytics build, and training
        if: github.event_name == 'schedule' || inputs.mode == 'incremental'
        run: python -m src.platform.cli run-all

      - name: Run controlled historical backfill
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: |
          test -n "${{ inputs.backfill_start }}" && test -n "${{ inputs.backfill_end }}"
          python -m src.platform.cli backfill --start "${{ inputs.backfill_start }}" --end "${{ inputs.backfill_end }}"

      - name: Commit changed artifacts file by file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No model/data changes to commit."
            exit 0
          fi

          git status --porcelain | while read -r status file; do
            if [ -f "$file" ]; then
              size_bytes=$(wc -c < "$file" | tr -d ' ')
              if [ "$size_bytes" -gt 104857600 ]; then
                echo "Refusing to commit >100MB file: $file ($size_bytes bytes)"
                exit 1
              fi
            fi

            case "$file" in
              models/*)
                prefix="model"
                ;;
              data/*)
                prefix="data"
                ;;
              src/app/*|pages/*|streamlit_app.py)
                prefix="ui"
                ;;
              src/*|tests/*)
                prefix="fix"
                ;;
              *)
                prefix="feat"
                ;;
            esac

            git add "$file"
            git commit -m "$prefix: update $file"
            git push origin main
          done
