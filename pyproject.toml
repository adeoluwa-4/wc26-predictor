[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wc26-predictor"
version = "0.1.0"
description = "Date-safe data pipeline for World Cup 2026 match and tournament prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ade Adekoya" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "catboost>=1.2",
  "duckdb>=1.1,<2",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
  "pandera[pandas]>=0.20,<1",
  "prefect>=3.0,<4",
  "streamlit>=1.38",
  "plotly>=5.24",
]

[project.scripts]
wc26-pipeline = "src.platform.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
